[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-portfolio-media-monitor"
version = "1.0.0"
description = "Incremental media monitoring dashboard for Green Portfolio"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "gspread>=6.1,<7",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "python-dateutil>=2.9,<3",
  "requests>=2.32,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
